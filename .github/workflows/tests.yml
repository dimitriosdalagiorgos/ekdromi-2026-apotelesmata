name: Έλεγχοι

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  katametrisi:
    name: Καταμέτρηση
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/count.test.js

  selida:
    name: Σελίδα
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/page.test.js
